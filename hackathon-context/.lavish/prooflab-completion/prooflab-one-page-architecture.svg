<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 810" role="img" aria-labelledby="arch-title arch-description">
<title id="arch-title">ProofLab — detailed logical architecture and execution boundaries</title>
<desc id="arch-description">Provided telecom agents run across ServiceNow and AWS. Verified shared gateway and second boundary adapters invoke a common control contract. Only admission evaluation and atomic budget coordination block inference. Asynchronous records reconcile with independent expected populations. Three deterministic control tests feed judge queries, portable exports and actual ServiceNow governance integration. Current status is a design proposal, with zero implemented controls.</desc>
<rect x="0" y="0" width="1080" height="810" fill="#ffffff"/>
<style>svg{background:#fff;color:#16202c;font-family:system-ui,-apple-system,sans-serif}text{fill:#16202c;font-size:16px}.title{font-size:28px;font-weight:750}.sub{font-size:12px;fill:#5b6472}.label{font-size:12px;letter-spacing:1px;fill:#2563eb;font-weight:700}.box{fill:#f5f6f8;stroke:#dfe3e8;stroke-width:1.5}.key{fill:#eff5ff;stroke:#2563eb;stroke-width:1.7}.outline{fill:none;stroke:#a65d05;stroke-width:1.5;stroke-dasharray:5 4}.flow{fill:none;stroke:#2563eb;stroke-width:1.7}.async{stroke-dasharray:5 4}.arrow{fill:#2563eb}.bold{font-weight:700}</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0 0 L10 5 L0 10Z"/></marker></defs>
<text class="title" x="24" y="38">ProofLab · control implementation → inspectable evidence</text><text class="sub" x="24" y="61">Design proposal · current completion 0/3 · conditional cloud mapping · one shared Python package</text>
<text class="label" x="24" y="93">PROVIDED SUBJECT WORKFLOW</text>
<g id="subject-customer"><title>ServiceNow customer and ticket agent; actual Nemotron usage and correlation must be verified</title><rect class="box" x="24" y="107" width="240" height="75" rx="9"/><text class="bold" x="40" y="138">Customer / ticket agent</text><text class="sub" x="40" y="162">ServiceNow · root run correlation</text></g>
<g id="subject-it"><title>AWS IT triage agent</title><rect class="box" x="420" y="107" width="240" height="75" rx="9"/><text class="bold" x="437" y="138">IT triage agent</text><text class="sub" x="437" y="162">AWS · account and service context</text></g>
<g id="subject-network"><title>AWS and NVIDIA network investigation agent</title><rect class="box" x="816" y="107" width="240" height="75" rx="9"/><text class="bold" x="832" y="138">Network agent</text><text class="sub" x="832" y="162">AWS / NVIDIA · diagnosis result</text></g>
<g id="handoff-a"><title>Gateway A handoff, expected send and receive obligations</title><path class="flow" d="M264 142 H420" marker-end="url(#arr)"/><text class="sub" x="307" y="129">Gateway A</text></g><g id="handoff-b"><title>Gateway B is the preferred second adapter; actual access remains a gate</title><path class="flow" d="M660 142 H816" marker-end="url(#arr)"/><text class="sub" x="704" y="129">Gateway B</text><text class="sub" x="691" y="168">second point</text></g>
<g id="model-call-bus"><title>All three agents’ model calls are intended to traverse the shared gateway; actual coverage must be verified</title><path class="flow" d="M144 182 V197 H936 V182 M540 182 V197 M144 197 V235" marker-end="url(#arr)"/><text class="sub" x="170" y="216">model calls + retries</text></g>
<text class="label" x="395" y="220">LIVE ADMISSION — ONLY VERIFIED IN-PATH HOOKS CAN REFUSE</text>
<g id="model-gateway"><title>Actual shared model gateway adapter, not assumed to be AgentCore Gateway</title><rect class="key" x="24" y="235" width="280" height="92" rx="9"/><text class="bold" x="40" y="265">Shared model gateway adapter</text><text class="sub" x="40" y="290">All agents + every actual retry</text><text class="sub" x="40" y="312">Trusted request / run / attempt identity</text></g>
<g id="admission"><title>Common evaluate contract with stateless evaluation and separate durable budget coordinator</title><rect class="key" x="403" y="235" width="292" height="92" rx="9"/><text class="bold" x="419" y="265">Control 16 admission</text><text class="sub" x="419" y="290">Pure evaluator + atomic coordinator</text><text class="sub" x="419" y="312">Reserve · dispatch guard · settle</text></g>
<g id="policy"><title>External policy register, immutable dated rules loaded before each governed run</title><rect class="box" x="795" y="235" width="261" height="92" rx="9"/><text class="bold" x="811" y="265">Frozen policy / mapping</text><text class="sub" x="811" y="290">Loaded before run; supplied as input</text><text class="sub" x="811" y="312">No register lookup per inference</text></g>
<g id="eval-call"><title>Synchronous invocation and response</title><path class="flow" d="M304 264 H403" marker-end="url(#arr)"/><text class="sub" x="324" y="251">evaluate</text><path class="flow" d="M403 306 H304" marker-end="url(#arr)"/><text class="sub" x="317" y="295">allow / deny</text></g>
<text class="sub" x="24" y="351">Coordinator holds minimal recoverable state; telemetry, rich ledger, ServiceNow and UI remain off the inference path.</text>
<text class="label" x="24" y="389">ASSESSMENT — FOUR TRANSPORTS, ONE CONTROL / EVIDENCE MODEL</text>
<g id="evidence"><title>Asynchronous source acquisition and reconciliation with independent work obligations</title><rect class="box" x="24" y="403" width="320" height="125" rx="9"/><text class="bold" x="40" y="434">Source adapters + reconciliation</text><text class="sub" x="40" y="459">emit / pull / callback · raw observations</text><text class="sub" x="40" y="481">Independent obligations + usage authority</text><text class="sub" x="40" y="503">Missing / conflict / duplicate / late data</text><text class="sub" x="40" y="520">Source capability and provenance retained</text></g>
<g id="tests"><title>Deterministic control tests share the policy and evidence contracts</title><rect class="key" x="403" y="403" width="292" height="125" rx="9"/><text class="bold" x="419" y="434">Three control tests</text><text x="419" y="460">7 · event coverage + eligible gaps</text><text x="419" y="488">9 · baseline + comparable windows</text><text x="419" y="516">16 · actual whole-run token usage</text></g>
<g id="benchmark"><title>Accepted ground-truth scenario corpus, independent labels and frozen comparable windows</title><rect class="box" x="795" y="403" width="261" height="125" rx="9"/><text class="bold" x="811" y="434">Control 9 experiment</text><text class="sub" x="811" y="459">Accepted labels + deterministic scoring</text><text class="sub" x="811" y="481">Separate baseline / assessed cases</text><text class="sub" x="811" y="503">Expected windows + named alert owner</text><text class="sub" x="811" y="520">No labels → no accuracy claim</text></g>
<g id="model-evidence"><title>Recoverable transition export and source observations emitted asynchronously</title><path class="flow async" d="M170 327 V403" marker-end="url(#arr)"/></g>
<g id="evidence-tests"><title>Source and expected-population reconciliation feeds tests</title><path class="flow" d="M344 464 H403" marker-end="url(#arr)"/></g><g id="benchmark-tests"><title>Versioned benchmark and measured windows feed drift test</title><path class="flow" d="M795 464 H695" marker-end="url(#arr)"/></g>
<text class="label" x="24" y="578">RELEASE — ACTUAL CONTROL COMPLETION, QUALITY AND BONUS PROOF</text>
<g id="judge"><title>Query recomputes selected control and run/window with exact rules, denominators and source references</title><rect class="key" x="24" y="592" width="320" height="104" rx="9"/><text class="bold" x="40" y="623">Judge CLI / optional local UI</text><text class="sub" x="40" y="648">Control + run/window → answer ≤ 2 min</text><text class="sub" x="40" y="670">Verdict · calculation · source refs · gaps</text><text class="sub" x="40" y="686">C-FM-01 branch coverage always visible</text></g>
<g id="release"><title>All six artifacts exported, with reference checker and real case identifiers</title><rect class="box" x="403" y="592" width="292" height="104" rx="9"/><text class="bold" x="419" y="623">Reproducible submission bundle</text><text class="sub" x="419" y="648">Evidence · rules · tool · named runs</text><text class="sub" x="419" y="670">One-page architecture · gap list</text><text class="sub" x="419" y="686">Independent arithmetic recheck offline</text></g>
<g id="governance"><title>Actual team-scoped ServiceNow integration, named owner and truthful delivery/response state</title><rect class="box" x="795" y="592" width="261" height="104" rx="9"/><text class="bold" x="811" y="623">ServiceNow governance</text><text class="sub" x="811" y="648">AICT asset + permitted finding route</text><text class="sub" x="811" y="670">Actual remote readback; owner named</text><text class="sub" x="811" y="686">Unanswered remains unanswered</text></g>
<g id="test-release"><title>Assessments and exact input sets populate release artifacts</title><path class="flow" d="M548 528 V592" marker-end="url(#arr)"/></g><g id="bundle-query"><title>Local client can query a portable snapshot without a cloud or LLM dependency</title><path class="flow" d="M403 645 H344" marker-end="url(#arr)"/></g><g id="finding-delivery"><title>Assessments deliver findings asynchronously without waiting for submission export; delivery is tracked separately from the verdict</title><path class="flow async" d="M695 512 H745 V556 H925 V592" marker-end="url(#arr)"/><text class="sub" x="765" y="546">async finding delivery</text></g>
<rect class="outline" x="24" y="724" width="1032" height="56" rx="8"/><text x="40" y="747" class="bold">Completion gate first: 3 measured controls + six artifacts + required platform integration.</text><text class="sub" x="40" y="767">Then verified bonuses: live admission · executed adversarial tests · running second point. No cloud capability is assumed proven.</text>
</svg>
