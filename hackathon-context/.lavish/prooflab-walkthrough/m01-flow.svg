<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="m01-title m01-description">
<title id="m01-title">M01: Three collaborating telecom agents and their two kinds of communication</title><desc id="m01-description">Customer agent in ServiceNow hands work to the AWS IT agent through Gateway A, which hands network investigation to the AWS/NVIDIA network agent through Gateway B. Results return through the same zone sequence. Each agent's model calls go through the shared model gateway to an approved Nemotron endpoint. The diagram describes the workshop design, not a verified live trace.</desc>
<rect width="1040" height="520" fill="#ffffff"/>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#16202c;font-size:16px}.title{font-size:26px;font-weight:750}.head{font-size:19px;font-weight:700}.sub{font-size:12px;fill:#5b6472}.box{fill:#f5f6f8;stroke:#dfe3e8;stroke-width:1.5}.key{fill:#f1f8e9;stroke:#548a10;stroke-width:1.6}.flow{fill:none;stroke:#2563eb;stroke-width:2}.return{fill:none;stroke:#77869a;stroke-width:1.5;stroke-dasharray:4 4}.model{fill:none;stroke:#548a10;stroke-width:2}.arrow{fill:#2563eb}.green{fill:#548a10}.gray{fill:#77869a}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="arrow" d="M0 0L10 5L0 10Z"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="green" d="M0 0L10 5L0 10Z"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="gray" d="M0 0L10 5L0 10Z"/></marker></defs>
<text x="24" y="37" class="title">M01 · What happens to the customer’s fault request?</text><text x="24" y="65" class="sub">Workshop-described flow · no direct customer-to-network route · actual hooks and payloads still need inspection</text>
<g id="customer"><title>M01.1 ServiceNow customer/ticket agent</title><rect class="box" x="24" y="103" width="280" height="112" rx="10"/><text x="40" y="134" class="head">Customer / ticket agent</text><text x="40" y="163">ServiceNow customer zone</text><text x="40" y="188" class="sub">Complaint → ticket and investigation request</text><text x="40" y="206" class="sub">Owns the customer-facing interaction</text></g>
<g id="it"><title>M01.2 AWS IT triage agent</title><rect class="box" x="380" y="103" width="280" height="112" rx="10"/><text x="396" y="134" class="head">IT triage agent</text><text x="396" y="163">AWS IT zone</text><text x="396" y="188" class="sub">Account, subscribed services and configuration</text><text x="396" y="206" class="sub">Supplies context for network investigation</text></g>
<g id="network"><title>M01.3 Network investigation agent with inventory and digital twin</title><rect class="box" x="736" y="103" width="280" height="112" rx="10"/><text x="752" y="134" class="head">Network investigation agent</text><text x="752" y="163">AWS / NVIDIA network zone</text><text x="752" y="188" class="sub">Network inventory + digital twin</text><text x="752" y="206" class="sub">Returns investigation findings</text></g>
<g id="handoff-a"><title>M01.7 Gateway A request and return path</title><path class="flow" d="M304 139H380" marker-end="url(#a)"/><text x="308" y="163" class="sub">Gateway A</text><path class="return" d="M380 184H304" marker-end="url(#r)"/></g>
<g id="handoff-b"><title>M01.8 Gateway B request and return path</title><path class="flow" d="M660 139H736" marker-end="url(#a)"/><text x="664" y="163" class="sub">Gateway B</text><path class="return" d="M736 184H660" marker-end="url(#r)"/></g>
<g id="model-bus"><title>According to the lab slide, model calls from every zone cross the shared model gateway</title><path class="model" d="M164 215V278H876V215M520 215V326" marker-end="url(#g)"/><text x="24" y="254" class="sub">Blue: work handoff</text><text x="708" y="254" class="sub">Gray dashed: findings return</text><text x="543" y="305" class="sub">Green: each agent’s model calls</text></g>
<g id="model-gateway"><title>M01.9 Shared model gateway, distinct from the two zone handoffs</title><rect class="key" x="310" y="326" width="420" height="66" rx="9"/><text x="330" y="353" class="head">Shared model gateway</text><text x="330" y="377" class="sub">Model request / response boundary · token visibility</text></g>
<g id="model-endpoint"><title>M01.6 Approved NVIDIA Nemotron inference</title><rect class="key" x="310" y="423" width="420" height="53" rx="9"/><text x="330" y="455" class="head">Approved Nemotron endpoint</text></g>
<g id="inference"><title>Model inference through the approved route</title><path class="model" d="M520 392V423" marker-end="url(#g)"/></g>
<text x="24" y="503" class="sub">A model response is an input to an agent’s next step; it is not proof that a repair happened or that a control passed.</text>
</svg>
