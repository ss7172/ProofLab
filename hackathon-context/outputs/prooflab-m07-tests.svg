<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 790" role="img" aria-labelledby="m07-title m07-description">
<title id="m07-title">M07: coverage and timing are separate requirements</title><desc id="m07-description">The masterclass teaching example has eleven required events and ten gaps: two, three, four, two, eight, three, two, four, three and two milliseconds. One gap violates the strict five-millisecond limit; one of ten equals the allowed ten percent. If E06 is absent, expected gaps G05 and G06 both become unmeasurable instead of disappearing.</desc>
<rect width="1080" height="790" fill="#fff"/>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#16202c;font-size:16px}.title{font-size:27px;font-weight:750}.head{font-size:19px;font-weight:700}.sub{font-size:12px;fill:#5b6472}.label{font-size:12px;fill:#2563eb;font-weight:700;letter-spacing:.7px}.box{fill:#f5f6f8;stroke:#dfe3e8;stroke-width:1.5}.key{fill:#eff5ff;stroke:#2563eb;stroke-width:1.7}.amber{fill:#fff7e9;stroke:#a65d05;stroke-width:1.6}.okbar{fill:#93bbf6;stroke:#2563eb;stroke-width:1.3}.badbar{fill:#f9bd6f;stroke:#a65d05;stroke-width:1.5}.axis{fill:none;stroke:#7c8ba0;stroke-width:1.3}.limit{stroke:#a65d05;stroke-width:1.5;stroke-dasharray:6 5}.unknown{fill:none;stroke:#a65d05;stroke-width:1.7;stroke-dasharray:5 4}</style>
<text class="title" x="24" y="38">M07 · Check coverage AND timing. Keep exceptions visible.</text><text class="sub" x="24" y="65">The slide's illustrative one-stream example · not measured lab results or proof of whole-system coverage</text>
<g id="m7-coverage"><title>Coverage requires a justified independent population and valid matched records</title><rect class="key" x="24" y="106" width="312" height="130" rx="9"/><text class="head" x="40" y="138">Recording coverage</text><text x="40" y="169">11 / 11 events = 100%</text><text class="sub" x="40" y="196">Independent expected event slots</text><text class="sub" x="40" y="218">Duplicates do not fill missing slots</text></g>
<g id="m7-rule"><title>Strict single-gap limit and inclusive exception allowance are different parameters</title><rect class="key" x="382" y="106" width="674" height="130" rx="9"/><text class="head" x="398" y="138">Timing rule: gap &lt; 5 ms · violating gaps ≤ 10%</text><text x="398" y="169">1 / 10 gaps violate = 10% → within the allowance</text><text class="sub" x="398" y="196">All expected pairs measurable in this example; eligible clock and source scope assumed.</text><text class="sub" x="398" y="218">Exactly 5 ms violates the limit. Exactly 10% exceptions is permitted.</text></g>
<text class="label" x="24" y="278">TEN ELIGIBLE GAPS FROM ELEVEN RECORDED EVENTS</text><text class="sub" x="638" y="313">5 ms boundary — values at or above it violate</text>
<g id="m7-gap-plot"><title>Gap G05 is the only violation at eight milliseconds; the remaining gaps are below five</title><path class="axis" d="M50 490H1032"/><line class="limit" x1="50" y1="390" x2="1032" y2="390"/>
<g id="m7-g01"><title>G01: 2 milliseconds</title><rect class="okbar" x="75" y="450" width="44" height="40" rx="3"/><text x="91" y="438">2</text><text class="sub" x="84" y="512">G01</text></g>
<g id="m7-g02"><title>G02: 3 milliseconds</title><rect class="okbar" x="169" y="430" width="44" height="60" rx="3"/><text x="185" y="418">3</text><text class="sub" x="178" y="512">G02</text></g>
<g id="m7-g03"><title>G03: 4 milliseconds</title><rect class="okbar" x="263" y="410" width="44" height="80" rx="3"/><text x="279" y="398">4</text><text class="sub" x="272" y="512">G03</text></g>
<g id="m7-g04"><title>G04: 2 milliseconds</title><rect class="okbar" x="357" y="450" width="44" height="40" rx="3"/><text x="373" y="438">2</text><text class="sub" x="366" y="512">G04</text></g>
<g id="m7-g05"><title>G05: 8 milliseconds, a retained exception</title><rect class="badbar" x="451" y="330" width="44" height="160" rx="3"/><text x="467" y="318">8</text><text class="sub" x="460" y="512">G05</text></g>
<g id="m7-g06"><title>G06: 3 milliseconds</title><rect class="okbar" x="545" y="430" width="44" height="60" rx="3"/><text x="561" y="418">3</text><text class="sub" x="554" y="512">G06</text></g>
<g id="m7-g07"><title>G07: 2 milliseconds</title><rect class="okbar" x="639" y="450" width="44" height="40" rx="3"/><text x="655" y="438">2</text><text class="sub" x="648" y="512">G07</text></g>
<g id="m7-g08"><title>G08: 4 milliseconds</title><rect class="okbar" x="733" y="410" width="44" height="80" rx="3"/><text x="749" y="398">4</text><text class="sub" x="742" y="512">G08</text></g>
<g id="m7-g09"><title>G09: 3 milliseconds</title><rect class="okbar" x="827" y="430" width="44" height="60" rx="3"/><text x="843" y="418">3</text><text class="sub" x="836" y="512">G09</text></g>
<g id="m7-g10"><title>G10: 2 milliseconds</title><rect class="okbar" x="921" y="450" width="44" height="40" rx="3"/><text x="937" y="438">2</text><text class="sub" x="930" y="512">G10</text></g></g>
<text class="sub" x="24" y="544">A second violating gap gives 2 / 10 = 20% and breaches the same rule. These are pair intervals, not assumed model latency.</text>
<g id="m7-missing-panel"><title>Removing E06 retains both expected pairs and produces uncertainty instead of a smaller denominator</title><rect class="amber" x="24" y="575" width="1032" height="149" rx="9"/><text class="head" x="40" y="606">If E06 is missing, both adjacent pairs remain expected.</text>
<rect class="box" x="44" y="631" width="120" height="44" rx="6"/><text x="86" y="659">E05</text><rect class="unknown" x="258" y="631" width="140" height="44" rx="6"/><text x="277" y="659">E06 missing</text><rect class="box" x="492" y="631" width="120" height="44" rx="6"/><text x="534" y="659">E07</text>
<path class="unknown" d="M164 653H258M398 653H492"/><text class="sub" x="191" y="643">G05</text><text class="sub" x="425" y="643">G06</text>
<text x="670" y="651">P=10 · M=8 · K=0 · U=2</text><text class="sub" x="670" y="676">Possible violating share: 0–20% → unknown</text><text class="sub" x="40" y="707">Never replace them with E05 → E07. A confirmed recording omission separately fails the 100% coverage rule.</text></g>
<text class="sub" x="24" y="756">An unfinished download alone does not prove a recording omission. Confirm the source/deadline premise before claiming a breach.</text><text class="sub" x="24" y="779">Unknown clock or expected-pair population means insufficient timing evidence; do not fabricate a passing gap.</text>
</svg>
