<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a2332"/></marker>
    <marker id="e" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a5cd6"/></marker>
    <marker id="x" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b91c1c"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>

  <!-- account frame -->
  <rect x="14" y="14" width="1172" height="692" rx="12" fill="none" stroke="#9aa3af" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="30" y="40" font-size="13" font-weight="700" fill="#5b6472" font-family="Menlo,monospace">YOUR TEAM'S AWS ACCOUNT — pre-provisioned · governed-only</text>

  <!-- Your team -->
  <rect x="420" y="60" width="360" height="56" rx="10" fill="#1a2332"/>
  <text x="600" y="84" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">YOUR TEAM</text>
  <text x="600" y="102" font-size="10.5" fill="#b9c2cf" text-anchor="middle" font-family="Menlo,monospace">kubectl · curl + API key · your audit utility</text>

  <!-- direct path (denied) -->
  <path d="M 520 116 C 400 150, 250 170, 190 208" stroke="#b91c1c" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#x)"/>
  <rect x="60" y="210" width="260" height="64" rx="8" fill="#fdeaea" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="190" y="235" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">DIRECT Bedrock / AgentCore</text>
  <text x="190" y="253" font-size="11" fill="#b91c1c" text-anchor="middle" font-family="Menlo,monospace">AccessDeniedException</text>
  <text x="190" y="267" font-size="9.5" fill="#8a4a4a" text-anchor="middle">no side doors — by design</text>

  <!-- governed path -->
  <line x1="600" y1="116" x2="600" y2="160" stroke="#1a2332" stroke-width="2" marker-end="url(#a)"/>
  <text x="612" y="145" font-size="10" fill="#5b6472" font-family="Menlo,monospace">the ONLY door</text>

  <!-- gateway band -->
  <rect x="340" y="164" width="700" height="120" rx="10" fill="#e8f4ec" stroke="#1a7f4b" stroke-width="1.8"/>
  <text x="356" y="188" font-size="12" font-weight="700" fill="#1a7f4b" font-family="Menlo,monospace">THE GOVERNED GATEWAY · modaas-agw</text>
  <rect x="356" y="200" width="200" height="68" rx="6" fill="#fff" stroke="#1a7f4b"/>
  <text x="456" y="224" font-size="11.5" font-weight="700" text-anchor="middle">1 · Identity</text>
  <text x="456" y="240" font-size="9.5" fill="#5b6472" text-anchor="middle" font-family="Menlo,monospace">API key / OAuth</text>
  <text x="456" y="256" font-size="9.5" fill="#5b6472" text-anchor="middle">who is calling?</text>
  <rect x="576" y="200" width="200" height="68" rx="6" fill="#fff" stroke="#1a7f4b"/>
  <text x="676" y="224" font-size="11.5" font-weight="700" text-anchor="middle">2 · Authorization</text>
  <text x="676" y="240" font-size="9.5" fill="#5b6472" text-anchor="middle" font-family="Menlo,monospace">Cedar policy (PDP)</text>
  <text x="676" y="256" font-size="9.5" fill="#5b6472" text-anchor="middle">is it allowed? fails closed</text>
  <rect x="796" y="200" width="228" height="68" rx="6" fill="#fff" stroke="#1a7f4b"/>
  <text x="910" y="224" font-size="11.5" font-weight="700" text-anchor="middle">3 · Guardrail</text>
  <text x="910" y="240" font-size="9.5" fill="#5b6472" text-anchor="middle" font-family="Menlo,monospace">"Input blocked by policy."</text>
  <text x="910" y="256" font-size="9.5" fill="#5b6472" text-anchor="middle">attacks blocked · legit passes</text>

  <!-- to bedrock -->
  <line x1="690" y1="284" x2="690" y2="322" stroke="#1a2332" stroke-width="2" marker-end="url(#a)"/>
  <rect x="560" y="326" width="260" height="54" rx="8" fill="#f1f1ec" stroke="#c8ccd4"/>
  <text x="690" y="349" font-size="12.5" font-weight="700" text-anchor="middle">Amazon Bedrock</text>
  <text x="690" y="366" font-size="10" fill="#5b6472" text-anchor="middle" font-family="Menlo,monospace">approved models only (e.g. Nova Lite)</text>

  <!-- control plane -->
  <text x="30" y="425" font-size="11" font-weight="700" letter-spacing="2" fill="#eb6c36" font-family="Menlo,monospace">CONTROL PLANE — how an asset becomes servable</text>
  <rect x="30" y="436" width="1140" height="96" rx="10" fill="#fff" stroke="#1a7f4b" stroke-width="1.4"/>
  <rect x="48" y="452" width="196" height="62" rx="6" fill="#e8f4ec" stroke="#1a7f4b"/>
  <text x="146" y="476" font-size="11" font-weight="700" text-anchor="middle">Declare a CR</text>
  <text x="146" y="492" font-size="9" fill="#5b6472" text-anchor="middle" font-family="Menlo,monospace">ModelConfig · ToolConfig</text>
  <text x="146" y="504" font-size="9" fill="#5b6472" text-anchor="middle" font-family="Menlo,monospace">AgentConfig · Registry</text>
  <line x1="244" y1="483" x2="278" y2="483" stroke="#1a2332" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="282" y="452" width="196" height="62" rx="6" fill="#e8f4ec" stroke="#1a7f4b"/>
  <text x="380" y="476" font-size="11" font-weight="700" text-anchor="middle">Admission (CEL)</text>
  <text x="380" y="492" font-size="9" fill="#5b6472" text-anchor="middle">self-contradictory governance</text>
  <text x="380" y="504" font-size="9" fill="#5b6472" text-anchor="middle">rejected at apply</text>
  <line x1="478" y1="483" x2="512" y2="483" stroke="#1a2332" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="516" y="452" width="196" height="62" rx="6" fill="#e8f4ec" stroke="#1a7f4b"/>
  <text x="614" y="476" font-size="11" font-weight="700" text-anchor="middle">Human approval</text>
  <text x="614" y="492" font-size="9" fill="#5b6472" text-anchor="middle" font-family="Menlo,monospace">approver + attestation</text>
  <text x="614" y="504" font-size="9" fill="#5b6472" text-anchor="middle">recorded on the CR</text>
  <line x1="712" y1="483" x2="746" y2="483" stroke="#1a2332" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="750" y="452" width="196" height="62" rx="6" fill="#e8f4ec" stroke="#1a7f4b"/>
  <text x="848" y="476" font-size="11" font-weight="700" text-anchor="middle">Approved → route</text>
  <text x="848" y="492" font-size="9" fill="#5b6472" text-anchor="middle">operators program the gateway</text>
  <text x="848" y="504" font-size="9" fill="#5b6472" text-anchor="middle" font-family="Menlo,monospace">pause → 404 in &lt; 60s</text>
  <line x1="946" y1="483" x2="980" y2="483" stroke="#1a2332" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="984" y="452" width="170" height="62" rx="6" fill="#e8f4ec" stroke="#1a7f4b"/>
  <text x="1069" y="476" font-size="11" font-weight="700" text-anchor="middle">Registered</text>
  <text x="1069" y="492" font-size="9" fill="#5b6472" text-anchor="middle">attested subject in</text>
  <text x="1069" y="504" font-size="9" fill="#5b6472" text-anchor="middle">AWS Agent Registry</text>

  <!-- evidence lane -->
  <text x="30" y="572" font-size="11" font-weight="700" letter-spacing="2" fill="#8a5cd6" font-family="Menlo,monospace">EVIDENCE — the standard surfaces your audit utility reads</text>
  <rect x="30" y="582" width="1140" height="92" rx="10" fill="#faf8fe" stroke="#8a5cd6" stroke-width="1.5"/>
  <text x="600" y="610" font-size="11.5" text-anchor="middle" fill="#3d2f5c">TMF639 inventory · CR status &amp; conditions · approval attestations · gateway request/response records · Registry cards · OTEL traces (traceparent)</text>
  <text x="600" y="636" font-size="11" font-weight="700" text-anchor="middle" fill="#6d3fc0">Every hop above writes here. Your utility turns this into what an auditor can trust — that's the competition.</text>
  <text x="600" y="660" font-size="9.5" text-anchor="middle" fill="#5b6472" font-family="Menlo,monospace">no privileged access — every team reads the same surfaces</text>

  <!-- evidence arrows -->
  <path d="M 456 268 C 420 340, 300 480, 240 582" stroke="#8a5cd6" stroke-width="1.3" stroke-dasharray="3 3" fill="none" marker-end="url(#e)"/>
  <path d="M 910 268 C 940 340, 1000 480, 1000 582" stroke="#8a5cd6" stroke-width="1.3" stroke-dasharray="3 3" fill="none" marker-end="url(#e)"/>
  <path d="M 614 514 C 614 540, 610 560, 605 582" stroke="#8a5cd6" stroke-width="1.3" stroke-dasharray="3 3" fill="none" marker-end="url(#e)"/>
</svg>
