    exception_tolerance: 0
    measurement_basis: "CloudWatch AWS/Bedrock-AgentCore metrics per run window W2, AWS-written"
    owner: annapurna@invences.com
    version_date: "2026-10-06T03:00:00Z"
    enforcement_point: "Scheduled pull after each run (continuous), near-real-time post-run evaluation"
    control_ref: C9
    library_id: AIA-ARC-006
    threshold_version: C9-v0
    mode: continuous
    in_claim: true
    objective: "A model or runtime change nobody reviewed is noticed within minutes"
    risk: "Drift goes unnoticed, or the measurements themselves are missing"
    risk_ref: R-C9
    scope: "ifabric runtimes; runs spaced at least 2 minutes apart for per-run attribution"
    applies_to: "ifabric-customer@PENDING-DIGEST@nemotron-super-120b,ifabric-it@PENDING-DIGEST@nemotron-super-120b,ifabric-network@PENDING-DIGEST@nemotron-super-120b"
    metric_unit: milliseconds
