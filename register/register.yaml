    why_value: "PENDING-PILOT: baseline from the declared baseline-eligible S1 and S3 runs (DC-11), n stated; the limit comes from the owner's appetite above the baseline spread"
    measured_on: "PENDING-PILOT: pilot ids P1 P3 and named runs declared baseline-eligible"
    stops_holding_when: "Warm-up policy or session policy changes, or fewer than the declared baseline runs exist for a runtime and scenario"
    missing_data_rule: "An expected invocation with no datapoint is INDETERMINATE; an idle hour is NOT_ASSESSED, never a gap"
    late_data_rule: "Metric publication delay is unverified; assess after the window plus the declared delay"
    duplicate_rule: "One datapoint per runtime and minute"
    invalid_data_rule: "A datapoint with no matching run window is listed unjoined"
    transport_inline: "none"
    transport_postrun: "pull of AgentCore metrics then assess"
    evaluator_module: "prooflab.evaluators.c9"
    evaluator_sha256: "PENDING-BUILD"
    alert_recipient: annapurna@invences.com
    alert_volume_bound: "one finding per crossing run"
    metric_namespace: "AWS/Bedrock-AgentCore"
    statistic: Maximum
    window_rule: "W2: run.started to run.finished plus 60 s, per runtime"
    baseline_procedure: "Largest Maximum per runtime and scenario over the declared baseline-eligible runs; frozen in the register version that first carries it"
    limit_direction: two-sided
    comparability: "Identical session policy for baseline and named runs; one unassessed warm-up invocation per updated runtime precedes the next baseline or assessed run"
    declared_treatments: "model-swap:ifabric-it:nemotron-nano-9b"
